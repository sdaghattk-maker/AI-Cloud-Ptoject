# اسکن زمان‌بندی‌شده بازار؛ نتیجه به‌صورت فایل JSON ذخیره می‌شود (artifact).
# توجه: Actions سرور دائمی نیست؛ برای API زنده از VPS/Render/Railway استفاده کنید.
name: Scheduled scan

on:
  schedule:
    - cron: "5 * * * *"   # هر ساعت، دقیقه ۵
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run scan
        run: python -c "import json; from app.analyzer import scan; json.dump(scan(), open('signals.json','w'), ensure_ascii=False, indent=2)"
      - uses: actions/upload-artifact@v4
        with:
          name: signals
          path: backend/signals.json
