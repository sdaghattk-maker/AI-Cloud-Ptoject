name: Apply update

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip files in repo root
        run: |
          ls *.zip
          for f in *.zip; do unzip -oq "$f"; done
          rm -f *.zip
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply update" || echo "nothing to commit"
          git push
      - name: Start CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml
